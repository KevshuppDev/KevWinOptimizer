[package]
name = "optimizador"
version = "1.0.1"
edition = "2021"

[dependencies]
eframe = { version = "0.29.1", default-features = false, features = ["glow", "default_fonts"] }
ureq = "2"
tray-icon = { version = "0.19", default-features = false }
raw-window-handle = "0.6"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_SystemInformation"] }

[build-dependencies]
embed-resource = "2.5"

[profile.release]
opt-level = "s"
lto = true
strip = true
